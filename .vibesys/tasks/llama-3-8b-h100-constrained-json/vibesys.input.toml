version = 1

[agent]
domain = "llm-serving"

[accuracy]
command = [
  "uv", "run", "--no-project",
  "--with-requirements", ".vibesys/tasks/llama-3-8b-h100-constrained-json/requirements.txt",
  "python", ".vibesys/tasks/llama-3-8b-h100-constrained-json/accuracy_checker/checker.py",
]
timeout_seconds = 300

[benchmark]
command = [
  "uv", "run", "--no-project",
  "--with-requirements", ".vibesys/tasks/llama-3-8b-h100-constrained-json/requirements.txt",
  "python", ".vibesys/tasks/llama-3-8b-h100-constrained-json/benchmark/benchmark.py",
]
timeout_seconds = 600

[benchmark.result]
json_argument = "--output-json"
metric = "aggregate_throughput"
